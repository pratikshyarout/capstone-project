
name: Documentation Sync

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: read

jobs:
  docs-sync:
    name: docs-sync
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Detect relevant source changes
        id: changes
        shell: bash
        run: |
          git diff --name-only \
            "origin/${{ github.base_ref }}...HEAD" \
            > changed-files.txt

          if grep -Eq '^(src/|app\.js$|index\.js$|banking\.js$)' changed-files.txt; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report result
        if: always()
        run: |
          echo "Documentation sync workflow executed."
          echo "Relevant source changes: ${{ steps.changes.outputs.relevant }}"
          echo "Next step: generate and validate a documentation patch."
