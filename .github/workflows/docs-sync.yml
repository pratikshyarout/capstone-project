
name: Documentation Sync

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: read

jobs:
  docs-sync:
    name: docs-sync
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Detect relevant source changes
        id: changes
        shell: bash
        run: |
          git diff --name-only \
            "origin/${{ github.base_ref }}...HEAD" \
            > changed-files.txt

          echo "Changed files:"
          cat changed-files.txt

          echo "changed_files<<EOF" >> "$GITHUB_OUTPUT"
          cat changed-files.txt >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          if grep -Eq '^(src/.*\.js|app\.js|index\.js|banking\.js|package\.json)$' changed-files.txt; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync documentation
        if: steps.changes.outputs.relevant == 'true'
        env:
          CHANGED_FILES: ${{ steps.changes.outputs.changed_files }}
        run: node scripts/sync-docs.js

      - name: Validate documentation
        if: steps.changes.outputs.relevant == 'true'
        run: node scripts/validate-docs.js
