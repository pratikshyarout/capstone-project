
name: Documentation Sync

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write
  pull-requests: write

jobs:
  docs-sync:
    name: docs-sync
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Detect relevant source changes
        id: changes
        shell: bash
        run: |
          git diff --name-only \
            "origin/${{ github.base_ref }}...HEAD" \
            > changed-files.txt

          echo "Changed files:"
          cat changed-files.txt

          echo "changed_files<<EOF" >> "$GITHUB_OUTPUT"
          cat changed-files.txt >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          if grep -Eq '^(src/.*\.js|app\.js|index\.js|banking\.js|package\.json)$' changed-files.txt; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync documentation
        if: steps.changes.outputs.relevant == 'true'
        env:
          CHANGED_FILES: ${{ steps.changes.outputs.changed_files }}
        run: node scripts/sync-docs.js

      - name: Validate documentation
        if: steps.changes.outputs.relevant == 'true'
        run: node scripts/validate-docs.js
        
     
     
      - name: Publish documentation updates
        if: steps.changes.outputs.relevant == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          git add docs/
          git diff --cached --binary > /tmp/docs-update.patch

          if [ ! -s /tmp/docs-update.patch ]; then
            echo "No documentation changes to publish."
            exit 0
          fi

          BRANCH="docs-sync/${PR_NUMBER}"

          git fetch origin master
          git checkout -B "$BRANCH" origin/master

          # Create destination files if they don't exist on master.
          mkdir -p docs
          touch docs/business-logic.md docs/configuration.md \
                docs/data-model.md docs/setup-guide.md

          git apply --3way --reject /tmp/docs-update.patch || {
            echo "Patch could not be applied cleanly."
            find . -name "*.rej" -print
            exit 1
          }

          git add docs/
          if git diff --cached --quiet; then
            echo "No documentation changes to publish."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: sync generated documentation"
          git push --force-with-lease origin "$BRANCH"

          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            echo "Documentation pull request already exists."
          else
            gh pr create \
              --base master \
              --head "$BRANCH" \
              --title "docs: sync generated documentation" \
              --body "Automated documentation updates generated from source changes in PR #${PR_NUMBER}."
          fi
